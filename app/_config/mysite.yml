---
Name: myproject
---
SilverStripe\Core\Manifest\ModuleManifest:
  project: app

# UTF8MB4 has limited support in older MySQL versions.
# Remove this configuration if you experience issues.
---
Name: myproject-database
---
SilverStripe\ORM\Connect\MySQLDatabase:
  connection_charset: utf8mb4
  connection_collation: utf8mb4_unicode_ci
  charset: utf8mb4
  collation: utf8mb4_unicode_ci

SilverStripe\SiteConfig\SiteConfig:
  extensions:
    - SubscribeConfig
    - ContactConfig
    - FooterTextConfig
    - FavIconConfig
   
SilverStripe\Security\MemberAuthenticator:
  extensions:
    - App\login\CustomLoginExtension


SilverStripe\Admin\LeftAndMain:
  extensions:
    - App\admin\AdminHeaderExtension

SilverStripe\Control\Director:
  rules:
    'order//$Action': 'App\api\OrderController'

